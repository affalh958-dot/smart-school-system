name: build-android-apk

# بناء نسخة أندرويد كاملة (APK) قابلة للتثبيت ونشرها للتحميل المباشر.
on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths:
      - 'app/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Fetch dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Build universal APK (release)
        run: flutter build apk --release

      - name: Verify APK exists
        run: |
          ls -la build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartSchool-Android
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.5-android
          name: "نظام إدارة المدرسة الذكي — أندرويد v1.0.5"
          body: |
            نسخة أندرويد كاملة (APK) جاهزة للتثبيت على الهاتف.

            **التثبيت:** انسخ ملف `SmartSchool-Android.apk` إلى الهاتف وافتحه،
            ثم اسمح بـ«تثبيت من مصادر غير معروفة» إن طُلب منك ذلك.

            يحتوي التطبيق: تسجيل الحضور بالتعرّف على الوجه، إدارة الطلاب والصفوف،
            الدرجات، التقارير، والمزامنة دون إنترنت.
          files: |
            app/build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: false
