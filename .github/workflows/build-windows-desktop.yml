name: build-windows-desktop

# بناء برنامج حاسوب حقيقي لويندوز: ملف تنفيذي (exe) + مثبّت Setup.exe.
# يجب أن يعمل على مشغّل windows لأن Flutter لا يمكنه البناء المتقاطع لويندوز من لينكس.
on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths:
      - 'app/**'
      - '.github/workflows/build-windows-desktop.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Fetch dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Bundle Visual C++ runtime (app-local, no install needed)
        shell: pwsh
        run: |
          # ننسخ مكتبات VC++ بجانب البرنامج حتى يعمل على أي جهاز بلا تثبيت مسبق.
          # هذا سبب شائع لعدم فتح school_app.exe بالنقر على أجهزة لا تحتوي
          # حزمة إعادة التوزيع Visual C++.
          $dest = (Resolve-Path "build/windows/x64/runner/Release").Path
          $files = @(
            "msvcp140.dll","msvcp140_1.dll","msvcp140_2.dll","msvcp140_atomic_wait.dll",
            "msvcp140_codecvt_ids.dll","vcruntime140.dll","vcruntime140_1.dll",
            "vcruntime140_threads.dll","concrt140.dll"
          )
          $copied = 0

          # 1) نبحث في حِزم إعادة التوزيع الحقيقية VC++ (Redist) داخل Visual Studio.
          $vsRoots = @(
            "C:\Program Files\Microsoft Visual Studio",
            "C:\Program Files (x86)\Microsoft Visual Studio"
          )
          foreach ($r in $vsRoots) {
            if (-not (Test-Path $r)) { continue }
            $cand = Get-ChildItem -Path $r -Recurse -Filter "vcruntime140.dll" -ErrorAction SilentlyContinue |
                    Where-Object { $_.FullName -match "\\Redist\\" -and $_.FullName -match "\\x64\\" } |
                    Select-Object -First 1
            if ($cand) {
              Copy-Item "$($cand.Directory.FullName)\*.dll" $dest -Force -ErrorAction SilentlyContinue
              $copied++
              Write-Host "Bundled VC++ runtime from $($cand.Directory.FullName)"
            }
          }

          # 2) احتياطي: ننسخ من System32 (موجودة على المشغّل).
          if ($copied -eq 0) {
            foreach ($f in $files) {
              $src = Join-Path $env:SystemRoot "System32\$f"
              if (Test-Path $src) { Copy-Item $src $dest -Force; $copied++ }
            }
            Write-Host "Bundled VC++ runtime from System32"
          }

          # التحقق النهائي من وجود المكتبات الحيوية بجانب البرنامج.
          foreach ($f in @("vcruntime140.dll","msvcp140.dll","flutter_windows.dll","school_app.exe")) {
            if (-not (Test-Path (Join-Path $dest $f))) { throw "Missing $f in output folder" }
          }
          Write-Host "VC++ CRT present. Folder contents:"
          Get-ChildItem $dest -Filter "*.dll" | Select-Object -ExpandProperty Name

      - name: Verify exe exists
        shell: pwsh
        run: |
          if (-not (Test-Path "build/windows/x64/runner/Release/school_app.exe")) {
            throw "school_app.exe not found!"
          }

      - name: Bundle TensorFlow Lite native lib if present
        shell: pwsh
        continue-on-error: true
        run: |
          # مكتبة التعرّف على الوجه الأصلية (تُنسخ إن أنتجها البناء).
          $release = "build/windows/x64/runner/Release"
          $blobs = Get-ChildItem -Path "build/windows" -Recurse -Filter "libtensorflowlite_c-win.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($blobs) {
            New-Item -ItemType Directory -Force -Path "$release/blobs" | Out-Null
            Copy-Item $blobs.FullName "$release/blobs/" -Force
            Write-Host "Bundled tflite: $($blobs.FullName)"
          } else {
            Write-Host "tflite native lib not produced by build — التعرّف على الوجه يعمل على أندرويد فقط حالياً"
          }

      - name: Smoke test — تشغيل البرنامج والتأكد أنه يبدأ فعلاً
        shell: pwsh
        run: |
          # هذا الاختبار هو الدليل الحقيقي على أن البرنامج يفتح على ويندوز.
          # يشغّل الملف التنفيذي فعلياً وينتظر، ويطبع أي سجل خطأ إن فشل.
          $exe = (Resolve-Path "build/windows/x64/runner/Release/school_app.exe").Path
          Write-Host "Launching $exe"
          $p = Start-Process $exe -PassThru
          Start-Sleep -Seconds 25
          $p.Refresh()
          if ($p.HasExited) {
            Write-Host "!!! البرنامج خرج مبكراً — رمز الخروج: $($p.ExitCode)"
            Get-ChildItem "$env:APPDATA" -Recurse -Include "school*.log","*.log" -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "=== $($_.FullName) ==="; Get-Content $_.FullName -ErrorAction SilentlyContinue }
            throw "App exited early on Windows (الكود $($p.ExitCode))"
          }
          Write-Host "OK: البرنامج ما زال يعمل بعد 25 ثانية — بدء التشغيل ناجح."
          $db = Get-ChildItem "$env:APPDATA" -Recurse -Filter "school.db" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($db) { Write-Host "قاعدة البيانات أُنشئت: $($db.FullName) ($($db.Length) bytes)" }
          Stop-Process -Id $p.Id -Force
          Write-Host "تم إيقاف البرنامج بنجاح."

      - name: Add launcher for users (تشغيل مع إظهار الأخطاء)
        shell: pwsh
        run: |
          # ملف تشغيل يُظهر أي خطأ بدل الفشل الصامت للفني/المدير.
          $bat = @'
@echo off
chcp 65001 >nul
cd /d "%~dp0"
echo تشغيل نظام إدارة المدرسة الذكي...
school_app.exe
echo.
echo إن لم تظهر النافذة، اقرأ الملف: school_startup_error.log
pause
'@
          Set-Content -Path "build/windows/x64/runner/Release/run_school_app.bat" -Value $bat -Encoding UTF8
          Write-Host "Added run_school_app.bat"

      - name: Upload Windows app (Release folder)
        uses: actions/upload-artifact@v4
        with:
          # نرفع المجلد مباشرةً (لا نضغطه يدوياً) لأن GitHub يضعه في zip.
          # لتفادي «الضغط المزدوج» الذي يجعل المستخدم يرى ملف zip داخل zip.
          name: SmartSchool-Windows
          path: app/build/windows/x64/runner/Release/
          if-no-files-found: error

      - name: Build portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Compress-Archive -Path "build/windows/x64/runner/Release/*" `
            -DestinationPath "dist/SmartSchool-Windows-portable.zip" -Force
          Get-Item "dist/SmartSchool-Windows-portable.zip" | Format-List Name,Length

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer (Setup.exe)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          & $iscc "windows\installer.iss"
          Get-ChildItem "dist" | Format-List Name,Length

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SmartSchool-Setup
          path: app/dist/SmartSchool-Setup.exe
          if-no-files-found: error

      - name: Compute checksums
        shell: pwsh
        run: |
          Get-FileHash "dist/SmartSchool-Setup.exe" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  SmartSchool-Setup.exe" } | Tee-Object -FilePath "dist/SHA256SUMS.txt"

      - name: Publish GitHub Release
        # إصدار دائم قابل للتحميل المباشر دون تسجيل دخول (يحل مشكلة «الملف لا يفتح/الأرتيفاكت»).
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2-win
          name: "نظام إدارة المدرسة الذكي — ويندوز v1.0.2"
          body: |
            نسخة ويندوز الحقيقية (تطبيق مكتبي Flutter).

            **التثبيت:** حمّل `SmartSchool-Setup.exe` وشغّله.
            **بدون تثبيت:** حمّل `SmartSchool-Windows-portable.zip` وفكّ الضغط ثم شغّل `school_app.exe`.

            ملاحظات:
            - مكتبات Visual C++ مُضمّنة بجانب البرنامج (لا حاجة لتثبيت مسبق).
            - إن ظهر تحذير SmartScreen: اضغط «مزيد من المعلومات» ثم «التشغيل على أي حال» (الملف غير موقّع رقمياً؛ التوقيع يتطلب شهادة مدفوعة).
            - يتم تسجيل أي خطأ بدء تشغيل في `%APPDATA%\school_app\school_crash.log`.
          files: |
            app/dist/SmartSchool-Setup.exe
            app/dist/SmartSchool-Windows-portable.zip
            app/dist/SHA256SUMS.txt
          draft: false
          prerelease: false
