name: build-windows-desktop

# بناء برنامج حاسوب حقيقي لويندوز: ملف تنفيذي (exe) + مثبّت Setup.exe.
# يجب أن يعمل على مشغّل windows لأن Flutter لا يمكنه البناء المتقاطع لويندوز من لينكس.
on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths:
      - 'app/**'
      - '.github/workflows/build-windows-desktop.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Fetch dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Ensure Visual C++ runtime (copy NEWEST only, never an old one)
        shell: pwsh
        run: |
          # سبب انهيار البرنامج (0xC0000005 في MSVCP140.dll): حزم نسخة قديمة
          # (14.29 من VS2019) بجانب البرنامج يجعل ويندوز يحمّلها بدل النسخة
          # الصحيحة فيُحدث انتهاك وصول. لذلك ننسخ **أحدث** نسخة فقط، وأفضل
          # مصدر هو System32 (نسخة المشغّل المطابقة للأداة). وإن لم تتوفر
          # نترك CRT النظام يعمل (لا ننسخ شيئاً).
          $dest = (Resolve-Path "build/windows/x64/runner/Release").Path
          $needed = @("msvcp140.dll","vcruntime140.dll","vcruntime140_1.dll")
          $copied = 0
          foreach ($f in $needed) {
            $sys = Join-Path $env:SystemRoot "System32\$f"
            if (Test-Path $sys) { Copy-Item $sys $dest -Force; $copied++; Write-Host "Copied $f from System32" }
          }
          if ($copied -eq 0) { Write-Host "System32 CRT not found; relying on system-wide VC++ runtime (no local copy)." }
          # تحقق: لا نسمح بنسخة MSVCP140 أقدم من 14.30 (VS2022) إن وُجدت.
          $local = Join-Path $dest "msvcp140.dll"
          if (Test-Path $local) {
            $ver = (Get-Item $local).VersionInfo.FileVersion
            Write-Host "Local MSVCP140.dll version: $ver"
            $parts = ($ver -split ' ')[0] -split '\.'
            if ([int]$parts[1] -lt 30) { throw "STALE MSVCP140.dll ($ver) would crash the app — aborting." }
          }

      - name: Verify exe exists
        shell: pwsh
        run: |
          if (-not (Test-Path "build/windows/x64/runner/Release/school_app.exe")) {
            throw "school_app.exe not found!"
          }

      - name: Bundle TensorFlow Lite native lib if present
        shell: pwsh
        continue-on-error: true
        run: |
          # مكتبة التعرّف على الوجه الأصلية (تُنسخ إن أنتجها البناء).
          $release = "build/windows/x64/runner/Release"
          $blobs = Get-ChildItem -Path "build/windows" -Recurse -Filter "libtensorflowlite_c-win.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($blobs) {
            New-Item -ItemType Directory -Force -Path "$release/blobs" | Out-Null
            Copy-Item $blobs.FullName "$release/blobs/" -Force
            Write-Host "Bundled tflite: $($blobs.FullName)"
          } else {
            Write-Host "tflite native lib not produced by build — التعرّف على الوجه يعمل على أندرويد فقط حالياً"
          }

      - name: Smoke test — تشغيل البرنامج والتأكد أنه يبدأ فعلاً
        shell: pwsh
        run: |
          # هذا الاختبار هو الدليل الحقيقي على أن البرنامج يفتح على ويندوز.
          # يشغّل الملف التنفيذي فعلياً وينتظر، ويطبع أي سجل خطأ إن فشل.
          $exe = (Resolve-Path "build/windows/x64/runner/Release/school_app.exe").Path
          Set-Location (Split-Path $exe)
          Write-Host "Launching $exe"
          $p = Start-Process $exe -PassThru
          Start-Sleep -Seconds 25
          $p.Refresh()
          if ($p.HasExited) {
            $code = $p.ExitCode
            Write-Host "!!! البرنامج خرج مبكراً — رمز الخروج: $code (0x$('{0:X8}' -f $code))"
            foreach ($f in @("school_startup_error.log")) {
              if (Test-Path $f) { Write-Host "=== $f ==="; Get-Content $f }
            }
            Get-ChildItem "$env:APPDATA" -Recurse -Include "school*.log" -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "=== $($_.FullName) ==="; Get-Content $_.FullName -ErrorAction SilentlyContinue }
            # نطبع خطأ التطبيق من سجل أحداث ويندوز لمعرفة الوحدة المنهارة بالاسم.
            Get-WinEvent -FilterHashtable @{LogName='Application'; Level=2; StartTime=(Get-Date).AddMinutes(-4)} -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -match 'Application Error|Windows Error Reporting' } |
              Select-Object -First 3 |
              ForEach-Object { Write-Host "=== EVENT $($_.ProviderName) ==="; Write-Host $_.Message }
            throw "App exited early on Windows (الكود $code / 0x$('{0:X8}' -f $code))"
          }
          Write-Host "OK: البرنامج ما زال يعمل بعد 25 ثانية — بدء التشغيل ناجح."
          $db = Get-ChildItem "$env:APPDATA" -Recurse -Filter "school.db" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($db) { Write-Host "قاعدة البيانات أُنشئت: $($db.FullName) ($($db.Length) bytes)" }
          Stop-Process -Id $p.Id -Force
          Write-Host "تم إيقاف البرنامج بنجاح."

      - name: Add launcher for users (تشغيل مع إظهار الأخطاء)
        shell: pwsh
        run: |
          # ملف تشغيل يُظهر أي خطأ بدل الفشل الصامت للفني/المدير.
          $bat = @(
            "echo off",
            "chcp 65001 >nul",
            "cd /d ""%~dp0""",
            "echo تشغيل نظام إدارة المدرسة الذكي...",
            "school_app.exe",
            "echo.",
            "if not exist school_startup_error.log goto done",
            "echo ---- school_startup_error.log ----",
            "type school_startup_error.log",
            ":done",
            "echo إن لم تظهر النافذة اقرأ الملف school_startup_error.log",
            "pause"
          ) -join "`r`n"
          Set-Content -Path "build/windows/x64/runner/Release/run_school_app.bat" -Value "@$bat" -Encoding OEM
          Write-Host "Added run_school_app.bat"

      - name: Upload Windows app (Release folder)
        uses: actions/upload-artifact@v4
        with:
          # نرفع المجلد مباشرةً (لا نضغطه يدوياً) لأن GitHub يضعه في zip.
          # لتفادي «الضغط المزدوج» الذي يجعل المستخدم يرى ملف zip داخل zip.
          name: SmartSchool-Windows
          path: app/build/windows/x64/runner/Release/
          if-no-files-found: error

      - name: Build portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Compress-Archive -Path "build/windows/x64/runner/Release/*" `
            -DestinationPath "dist/SmartSchool-Windows-portable.zip" -Force
          Get-Item "dist/SmartSchool-Windows-portable.zip" | Format-List Name,Length

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer (Setup.exe)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          & $iscc "windows\installer.iss"
          Get-ChildItem "dist" | Format-List Name,Length

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SmartSchool-Setup
          path: app/dist/SmartSchool-Setup.exe
          if-no-files-found: error

      - name: Compute checksums
        shell: pwsh
        run: |
          Get-FileHash "dist/SmartSchool-Setup.exe" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  SmartSchool-Setup.exe" } | Tee-Object -FilePath "dist/SHA256SUMS.txt"

      - name: Publish GitHub Release
        # إصدار دائم قابل للتحميل المباشر دون تسجيل دخول (يحل مشكلة «الملف لا يفتح/الأرتيفاكت»).
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2-win
          name: "نظام إدارة المدرسة الذكي — ويندوز v1.0.2"
          body: |
            نسخة ويندوز الحقيقية (تطبيق مكتبي Flutter).

            **التثبيت:** حمّل `SmartSchool-Setup.exe` وشغّله.
            **بدون تثبيت:** حمّل `SmartSchool-Windows-portable.zip` وفكّ الضغط ثم شغّل `school_app.exe`.

            ملاحظات:
            - مكتبات Visual C++ مُضمّنة بجانب البرنامج (لا حاجة لتثبيت مسبق).
            - إن ظهر تحذير SmartScreen: اضغط «مزيد من المعلومات» ثم «التشغيل على أي حال» (الملف غير موقّع رقمياً؛ التوقيع يتطلب شهادة مدفوعة).
            - يتم تسجيل أي خطأ بدء تشغيل في `%APPDATA%\school_app\school_crash.log`.
          files: |
            app/dist/SmartSchool-Setup.exe
            app/dist/SmartSchool-Windows-portable.zip
            app/dist/SHA256SUMS.txt
          draft: false
          prerelease: false
